<div class="auth">
  <app-auth-hero />
  <section class="auth__panel">
    <div class="auth__card">
      <div>
        <h2>Se connecter</h2>
        <p>Retrouvez vos achats, vos factures et vos garanties.</p>
      </div>
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="field">
          <label for="email">Adresse e-mail</label>
          <div class="input-wrap">
            <app-icon name="mail" [size]="18" />
            <input id="email" class="input" type="email" formControlName="email" autocomplete="username" placeholder="nom@exemple.tn"
                   [class.is-invalid]="invalid('email')" />
          </div>
          @if (invalid('email')) { <span class="error">Saisissez une adresse e-mail valide.</span> }
        </div>
        <div class="field">
          <label for="password">Mot de passe</label>
          <div class="input-wrap">
            <app-icon name="lock" [size]="18" />
            <input id="password" class="input" [type]="show() ? 'text' : 'password'" formControlName="password" autocomplete="current-password"
                   [class.is-invalid]="invalid('password')" />
            <span class="suffix">
              <button type="button" class="icon-btn" [attr.aria-label]="show() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'" (click)="show.set(!show())">
                <app-icon [name]="show() ? 'eyeoff' : 'eye'" [size]="18" />
              </button>
            </span>
          </div>
          @if (invalid('password')) { <span class="error">Saisissez votre mot de passe.</span> }
        </div>

        @if (error(); as e) {
          <div class="form-error" role="alert"><app-icon name="alert" [size]="18" /><span>{{ e }}</span></div>
        }

        <button type="submit" class="btn btn--primary btn--block" [disabled]="loading()">
          @if (loading()) { <span class="spinner"></span> } Se connecter
        </button>
      </form>
      <p class="switch-line">Pas encore de compte ? <a routerLink="/inscription">Créer un compte</a></p>
    </div>
  </section>
</div>
