server.port=8080

# MySQL doit être démarré (XAMPP/WAMP/service MySQL). Port par défaut 3306 ; la base wbxdb est créée automatiquement.
spring.datasource.url=${WBX_DB_URL:jdbc:mysql://localhost:3306/wbxdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${WBX_DB_USER:root}
spring.datasource.password=${WBX_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Dossier de stockage des fichiers (hors du jar sur le VPS : variable WBX_UPLOAD_DIR, ex. /opt/wbx/uploads)
app.upload.dir=${WBX_UPLOAD_DIR:uploads}

# Limites d'upload (PDF 5 Mo max, images 2 Mo)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# JWT (HS256 needs a secret of at least 32 characters; use your own and do not push it to Git)
app.jwt.secret=${WBX_JWT_SECRET:wbx-dev-secret-change-me-0123456789-abcdef}
app.jwt.expiration-minutes=120

# Email de l'administrateur qui reçoit les demandes d'activation de compte
app.admin.email=${WBX_ADMIN_EMAIL:admin@wbx.tn}
# Adresse publique de l'application (liens dans les emails)
app.frontend.url=${WBX_FRONTEND_URL:http://localhost:4200}

# Rappel quotidien des garanties qui expirent (cron : seconde minute heure jour mois jour-semaine)
app.reminder.cron=0 0 8 * * *

# Envoi d'emails : décommenter et renseigner (exemple Gmail avec un "mot de passe d'application").
# Sans ces lignes, l'application fonctionne : les emails sont simplement écrits dans les logs.
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=votre.adresse@gmail.com
#spring.mail.password=mot-de-passe-application
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
